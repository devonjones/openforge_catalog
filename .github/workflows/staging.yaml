name: Staging

on:
  push:
    branches: [test]
concurrency:
  group: ${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  id-token: write
  contents: read
defaults:
  run:
    shell: bash

jobs:
  docker-build:
    name: Staging Docker Build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Context for Buildx
        run: |
          docker context create builders

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          endpoint: builders


      - name: Configure Staging OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.ECR_IAM_STAGING }}
          role-session-name: staging-ecr
          aws-region: us-east-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2
        id: login-com-test-ecr
        with:
          mask-password: true

      - name: Docker Build and Push
        id: docker-build
        if: ${{ ! inputs.use_cache }}
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: ./Dockerfile.api.deploy
          push: true
          platforms: linux/amd64
          provenance: false
          tags: "682033461796.dkr.ecr.us-east-1.amazonaws.com/openforge_catalog/api:${{ github.sha }}"

  frontend-deploy:
    name: Staging Frontend Deploy
    needs: docker-build
    if: ${{ needs.docker-build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Build frontend
        run: pnpm run build

      - name: Configure Staging AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.S3_IAM_STAGING }}
          role-session-name: staging-s3
          aws-region: us-east-1

      - name: Deploy to S3
        run: |
          cd out
          aws s3 sync . s3://staging-openforge-catalog-website/${{ github.sha }}
          echo "Deployed to staging at SHA: ${{ github.sha }}"

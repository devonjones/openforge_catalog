- name: "S2W: Wall on Tile: Wall: Boss Door"
  type: "blueprint"
  tags:
    - [object, tile]
    - [object, tile, wall_on_tile]
    - [build, s2w]
    - [component, boss_door]
    - [shape, wall]
  config:
    parts:
      - name: wall
        tags:
          require:
            - tag: build|separate wall
            - tag: component|boss_door
            - tag: shape|wall
            - tag: connection|openforge
          deny:
            - tag: shape|curved
            - tag: size|width|1.5
          constrain:
            - tag: size|width
      - name: floor
        tags:
          require:
            - tag: shape|floor
            - tag: shape|floor|wall
            - tag: build|s2w
          constrain:
            - tag: size|width
            - tag: size|depth
      - name: base
        tags:
          require:
            - tag: shape|base
            - tag: shape|base|square
          deny:
            - tag: shape|wall
            - tag: shape|base|wall
            - tag: shape|base|corner
            - tag: shape|option|notch
          constrain:
            - tag: size|width
            - tag: size|depth

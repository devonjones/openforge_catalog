- name: "S2W Wall on Tile Arrow Slit"
  type: "blueprint"
  tags:
    - [object, tile]
    - [object, tile, wall_on_tile]
    - [build, s2w]
    - [component, arrow_slit]
    - [shape, wall]
  config:
    wall:
      require:
        - tag: build|separate wall
        - tag: connection|openforge
        - tag: component|arrow_slit
        - tag: shape|wall
      constrain:
        - tag: size|width
    base:
      require:
        - tag: shape|base
        - tag: shape|base|square
      deny:
        - tag: shape|wall
        - tag: shape|base|wall
        - tag: shape|base|option
      constrain:
        - tag: size|width
        - tag: size|depth
    floor:
      require:
        - tag: shape|floor
        - tag: shape|floor|wall
        - tag: build|s2w
      constrain:
        - tag: size|width
        - tag: size|depth


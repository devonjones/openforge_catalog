- name: "S2W: Wall on Tile: Corner (Any)"
  type: "blueprint"
  tags:
    - [object, tile]
    - [object, tile, wall_on_tile]
    - [build, s2w]
    - [shape, corner]
  config:
    parts:
      - name: right wall
        tags:
          require:
            - tag: build|s2w
            - tag: shape|corner|right
            - tag: connection|openforge
            - tag: size|width|2
          deny:
            - tag: shape|column|low
          constrain:
            - tag: connection|side
      - name: left wall
        tags:
          require:
            - tag: build|s2w
            - tag: shape|corner|left
            - tag: connection|openforge
            - tag: size|width|2
          deny:
            - tag: shape|column|low
          constrain:
            - tag: connection|side
      - name: column
        tags:
          require:
            - tag: shape|column|corner
            - tag: build|s2w
            - tag: size|column_shape|L
          deny:
            - tag: shape|column|low
          constrain:
            - tag: connection|side
      - name: floor
        tags:
          require:
            - tag: shape|floor
            - tag: shape|floor|corner
            - tag: build|s2w
            - tag: size|width|2
            - tag: size|depth|2
      - name: base
        tags:
          require:
            - tag: shape|base
            - tag: shape|base|square
            - tag: size|width|2
            - tag: size|depth|2
          deny:
            - tag: shape|wall
            - tag: shape|base|wall
            - tag: shape|base|corner
            - tag: shape|option|notch
